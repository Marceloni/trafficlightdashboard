plugins {
    id ("application")
    id ("org.openjfx.javafxplugin").version("0.1.0")
    id ("org.beryx.jlink").version("3.1.3")
}

group = "de.hhn.it.devtools.javafx"
version = "1.0"


javafx {
    version = "25"
    modules = [ "javafx.controls", "javafx.fxml", "javafx.swing" ]
}

repositories {
    // JMapViewer is only published in the JOSM repository, not on Maven Central
    maven {
        url = "https://josm.openstreetmap.de/repository/releases/"
        content {
            includeGroup("org.openstreetmap.jmapviewer")
        }
    }
}

dependencies {
    implementation project (":apis")
    implementation("org.openstreetmap.jmapviewer:jmapviewer:2.25")
    // see also the dependencies in build.gradle (root)

}

application {
    mainModule = "devtools.javafx"
    mainClass = project.findProperty("mainClass") ?: "de.hhn.it.devtools.javafx.Main"
    applicationDefaultJvmArgs = ['-ea']
}


jlink {
    launcher {
        name = "devtools"
    }
}

tasks.register('runTrafficLightDashboard', JavaExec) {
    group = "application"
    description = "Starts the traffic light dashboard GUI"
    classpath = files(tasks.jar) + configurations.runtimeClasspath
    mainModule = "devtools.javafx"
    mainClass = "de.hhn.it.devtools.javafx.trafficlightdashboard.TrafficLightDashboardApp"
    jvmArgs = ['-ea', '--enable-native-access=javafx.graphics']
}
