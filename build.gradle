group = "de.hhn.it.devtools"
version = "1.0"

defaultTasks(":javafx:runTrafficLightDashboard")


allprojects {

    wrapper {
        gradleVersion = "9.7.1"
    }

    apply plugin: "java"

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }

    // New gradle 8 specific configuration
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // use slf versions with module-info information inside
        implementation("org.slf4j:slf4j-api:2.0.20") {
            because "we need the SimpleLoggingFacade with module information"
        }
        implementation("org.slf4j:slf4j-simple:2.0.20")
        // use JUnit 6 (BOM keeps jupiter and platform versions aligned)
        testImplementation(platform("org.junit:junit-bom:6.1.3"))
        testImplementation("org.junit.jupiter:junit-jupiter-api")
        testImplementation("org.junit.jupiter:junit-jupiter-params")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }
    javadoc {
        options.encoding = "UTF-8"
        source = project(':apis').sourceSets.main.allJava
    }

    testing {
        suites {
            test {
                useJUnitJupiter()
            }
        }
    }


}
